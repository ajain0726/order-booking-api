# Local MySQL for the "mysql" profile: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trading
      MYSQL_USER: trading
      MYSQL_PASSWORD: trading
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utrading", "-ptrading"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
